<!DOCTYPE html>
<html lang="pt-BR" class="bg-gray-50 text-gray-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zapwarm Manager PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 para popups bonitos -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { primary: '#10b981', dark: '#1e293b' } }
            }
        }
    </script>
</head>
<body class="flex h-screen overflow-hidden font-sans antialiased">

    <!-- Sidebar -->
    <aside class="w-64 bg-dark text-white flex flex-col shadow-xl">
        <div class="h-16 flex items-center justify-center border-b border-gray-700">
            <h1 class="text-2xl font-bold text-primary"><i class="fa-solid fa-fire mr-2"></i>Zapwarm</h1>
        </div>
        
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-gray-800 text-white rounded-lg transition-colors">
                <i class="fa-solid fa-server w-5 text-center"></i>
                <span class="font-medium">Instâncias</span>
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-emerald-400 hover:bg-gray-800 rounded-lg transition-colors" onclick="openAIAgents()">
                <i class="fa-solid fa-robot w-5 text-center"></i>
                <span class="font-medium">Agentes IA <span class="ml-2 text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full">Novo</span></span>
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition-colors mt-auto">
                <i class="fa-solid fa-book w-5 text-center"></i>
                <span class="font-medium">Documentação</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden relative">
        <!-- Header -->
        <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8 z-10">
            <h2 class="text-xl font-semibold text-gray-800">Gerenciar Instâncias</h2>
            <div class="flex items-center gap-4">
                <button onclick="openCreateModal()" class="bg-primary hover:bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm flex items-center gap-2 transition-colors">
                    <i class="fa-solid fa-plus"></i> Nova Instância
                </button>
            </div>
        </header>

        <!-- Content Body -->
        <div class="flex-1 overflow-y-auto p-8" id="main-content">
            <!-- Tabela de Instâncias -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-100 text-sm font-medium text-gray-500">
                            <th class="py-4 px-6">NOME DA INSTÂNCIA</th>
                            <th class="py-4 px-6">STATUS</th>
                            <th class="py-4 px-6">TOKEN / CHAVE</th>
                            <th class="py-4 px-6 text-right">AÇÕES</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm divide-y divide-gray-100" id="instances-list">
                        <tr>
                            <td colspan="4" class="text-center py-8 text-gray-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Carregando instâncias...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Modal QR Code -->
        <div id="qr-modal" class="hidden absolute inset-0 bg-black/50 flex items-center justify-center z-50">
            <div class="bg-white rounded-xl p-8 max-w-sm w-full text-center relative shadow-2xl">
                <button onclick="closeQrModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-800"><i class="fa-solid fa-xmark text-xl"></i></button>
                <h3 class="text-lg font-bold mb-2">Conectar WhatsApp</h3>
                <p class="text-sm text-gray-500 mb-6">Abra o WhatsApp no seu celular, vá em Aparelhos Conectados e aponte para o código abaixo.</p>
                <div class="bg-gray-100 w-64 h-64 mx-auto rounded-lg flex items-center justify-center mb-4 border border-gray-200">
                    <img id="qr-image" src="" alt="QR Code" class="hidden w-full h-full object-contain p-2">
                    <div id="qr-loading" class="text-gray-400"><i class="fa-solid fa-spinner fa-spin text-3xl"></i></div>
                </div>
            </div>
        </div>

    </main>

    <script src="app.js"></script>
</body>
</html>
